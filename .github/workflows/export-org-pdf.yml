name: Exportar artículos Org a PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Generar PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Instalar Pandoc, LaTeX y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended fonts-dejavu-core

      - name: Exportar artículos individuales y recopilaciones mensuales
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -d '' articles < <(find articulos -type f -name '*.org' -print0 | sort -z)
          if (( ${#articles[@]} == 0 )); then
            echo "No se encontraron artículos .org"
            exit 1
          fi

          # Cada artículo conserva una ruta equivalente dentro del ZIP del artefacto.
          for org in "${articles[@]}"; do
            output="dist/${org%.org}.pdf"
            mkdir -p "$(dirname "$output")"
            pandoc "$org" --from=org --standalone \
              --resource-path=".:$(dirname "$org"):assets" \
              --pdf-engine=xelatex \
              -V mainfont="DejaVu Serif" \
              -V monofont="DejaVu Sans Mono" \
              -V geometry:margin=2.2cm \
              --highlight-style=tango \
              --output="$output"
          done

          # Un PDF que contiene, por orden cronológico, todos los artículos del mes.
          while IFS= read -r -d '' monthdir; do
            mapfile -d '' monthly < <(find "$monthdir" -maxdepth 1 -type f -name '*.org' -print0 | sort -z)
            (( ${#monthly[@]} )) || continue
            year="$(basename "$(dirname "$monthdir")")"
            month="$(basename "$monthdir")"
            mkdir -p "dist/mensuales/$year"
            pandoc "${monthly[@]}" --from=org --standalone \
              --metadata="title:Gráficos por computador — $year-$month" \
              --resource-path=".:$monthdir:$monthdir/assets:assets" \
              --pdf-engine=xelatex \
              -V mainfont="DejaVu Serif" \
              -V monofont="DejaVu Sans Mono" \
              -V geometry:margin=2.2cm \
              --highlight-style=tango \
              --output="dist/mensuales/$year/$year-$month.pdf"
          done < <(find articulos -mindepth 2 -maxdepth 2 -type d -print0 | sort -z)

          find dist -type f -name '*.pdf' -print | sort

      - name: Publicar PDFs como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: graficos-por-computador-pdf
          path: dist/**/*.pdf
          if-no-files-found: error
          retention-days: 90
