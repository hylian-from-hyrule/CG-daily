name: Exportar Org con Emacs a PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: PDF mensual con Org mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Emacs y XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            emacs-nox \
            texlive-xetex texlive-latex-extra \
            texlive-latex-recommended texlive-fonts-recommended \
            texlive-lang-spanish lmodern fonts-dejavu-core

      - name: Exportar con Org en modo batch
        env:
          TZ: Europe/Madrid
        run: |
          set -euo pipefail
          emacs --batch -Q -l scripts/export-month.el
          find dist -maxdepth 1 -type f -name '*.pdf' -print
          test "$(find dist -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 1

      - name: Subir único PDF mensual
        uses: actions/upload-artifact@v4
        with:
          name: pdf-mensual
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 90
